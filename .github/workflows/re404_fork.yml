name: Build re404 fork Kernel with Multi-KSU & Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Branch to build"
        required: true
        default: "stable"
      ENABLE_KERNELSU:
        description: "Tích hợp KernelSU?"
        required: true
        type: boolean
        default: true
      WHICH_KSU:
        description: "Chọn biến thể KernelSU"
        required: true
        type: choice
        options:
          - "ReSukiSU"
          - "BakaSU"
          - "KernelSU-Next"
          - "SukiSU-Ultra"
          - "XXKSU-SUSFS"
          - "RKSU (rsuntk)"
          - "backslashxx-KernelSU"
          - "KOWX712-KernelSU"
          - "MidoriSU"
        default: "ReSukiSU"
      enable_susfs:
        description: "Cấu hình CONFIG_KSU_SUSFS (Bật đầy đủ cờ ẩn Root)"
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Workspace Init
        id: workspace
        run: |
          echo "start_time=$(date +\%s)" >> "$GITHUB_OUTPUT"
          echo "kernelsu=${{ inputs.ENABLE_KERNELSU && 'Yes' || 'No' }}" >> "$GITHUB_OUTPUT"

      - name: Clone Kernel Source
        id: kernel
        run: |
          git clone \
            --recursive \
            --depth=1 \
            -b "${{ github.event.inputs.kernel_branch }}" \
            https://github.com/dumpcode404/xiaomi_sm8250_kernel_e404_fork.git kernel
          echo "kernel-folder=kernel" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            jq \
            libssl-dev \
            lld \
            llvm \
            python3 \
            zstd \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Download Neutron Clang
        run: |
          mkdir -p clang
          wget -qO clang.tar.zst https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst || true
          if [ -s clang.tar.zst ]; then
            tar --zstd -xf clang.tar.zst -C clang
          fi

          CLANG_BIN="$(find "$GITHUB_WORKSPACE/clang" \( -type f -o -type l \) -name 'clang' -exec dirname {} \; | head -n 1)"
          if [ -n "$CLANG_BIN" ]; then
            echo "Found Clang binary at: $CLANG_BIN"
            echo "$CLANG_BIN" >> "$GITHUB_PATH"
          else
            echo "Using system Clang: $(which clang)"
          fi

      - name: Adding KernelSU & Integrating SuSFS
        if: inputs.ENABLE_KERNELSU
        working-directory: ${{ steps.kernel.outputs.kernel-folder }}
        run: |
          KSU_CHOICE="${{ inputs.WHICH_KSU }}"
          echo "Setting up KernelSU fork: ${KSU_CHOICE}"

          # Dọn dẹp submodule KernelSU có sẵn trong source
          git submodule deinit -f KernelSU 2>/dev/null || true
          git rm -rf KernelSU 2>/dev/null || rm -rf KernelSU .git/modules/KernelSU

          case "$KSU_CHOICE" in
            "ReSukiSU")
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s v4.2.0-rc3
              ;;
            "BakaSU")
              if [ "${{ inputs.enable_susfs }}" = "true" ]; then
                curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh" | bash -s v4.2.0-rc3
              else
                curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh" | bash -s main
              fi
              ;;
            "SukiSU-Ultra")
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/refs/heads/main/kernel/setup.sh" | bash -s susfs-main
              ;;
            "XXKSU-SUSFS")
              curl -LSs "https://raw.githubusercontent.com/zenwav/KernelSU-SUSFS/refs/heads/master/kernel/setup.sh" | bash -s master
              ;;
            "RKSU (rsuntk)")
              curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s v3.2.2-10-legacy
              ;;
            "backslashxx-KernelSU")
              curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
              ;;
            "KOWX712-KernelSU")
              curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
              ;;
            "MidoriSU")
              curl -LSs "https://raw.githubusercontent.com/midori01/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
              ;;
            *)
              if [ "${{ inputs.enable_susfs }}" = "true" ]; then
                curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/refs/heads/next-susfs/kernel/setup.sh" | bash -s next-susfs
              else
                curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/refs/heads/next/kernel/setup.sh" | bash -s next
              fi
              ;;
          esac

          # Tích hợp đầy đủ SuSFS (Bao gồm cả Kernel VFS Patch + Files)
          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            echo "=== Đồng bộ và Patch mã nguồn SuSFS 4.19 vào kernel core ==="
            rm -rf /tmp/susfs4ksu
            git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu || \
            git clone --depth=1 -b kernel-4.19 https://github.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu

            if [ -d "/tmp/susfs4ksu" ]; then
              # 1. Copy các tệp thực thi và header của SuSFS
              cp -rf /tmp/susfs4ksu/kernel_patches/fs/* fs/ 2>/dev/null || cp -rf /tmp/susfs4ksu/KernelPatches/fs/* fs/ 2>/dev/null || true
              cp -rf /tmp/susfs4ksu/kernel_patches/include/linux/* include/linux/ 2>/dev/null || cp -rf /tmp/susfs4ksu/KernelPatches/include/linux/* include/linux/ 2>/dev/null || true

              # 2. Áp dụng file Patch VFS vào nhân 4.19 (Bắt buộc để SuSFS hoạt động thực sự)
              SUSFS_PATCH=$(find /tmp/susfs4ksu -name "50_add_susfs_in_kernel*.patch" | head -n 1)
              if [ -n "$SUSFS_PATCH" ]; then
                echo "Đang áp dụng patch nhân: $SUSFS_PATCH"
                patch -p1 -F 3 --no-backup-if-mismatch < "$SUSFS_PATCH" || true
              fi

              # 3. Đảm bảo fs/Kconfig có khai báo CONFIG_KSU_SUSFS để không bị xóa khi chạy olddefconfig
              if ! grep -q "config KSU_SUSFS" fs/Kconfig 2>/dev/null; then
                cat << 'EOF' >> fs/Kconfig

config KSU_SUSFS
	bool "KernelSU - SUSFS"
	depends on KSU
	default y
	help
	  Patch and Enable SUSFS to kernel with KernelSU.

config KSU_SUSFS_HAS_MAGIC_MOUNT
	bool "Say yes if the current KernelSU repo has magic mount implemented"
	depends on KSU_SUSFS
	default y

config KSU_SUSFS_SUS_PATH
	bool "Enable to hide suspicious path"
	depends on KSU_SUSFS
	default y

config KSU_SUSFS_SUS_MOUNT
	bool "Enable to hide suspicious mounts"
	depends on KSU_SUSFS
	default y

config KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
	bool "Enable to hide KSU's default mounts automatically"
	depends on KSU_SUSFS_SUS_MOUNT
	default y

config KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
	bool "Enable to hide suspicious bind mounts automatically"
	depends on KSU_SUSFS_SUS_MOUNT
	default y

config KSU_SUSFS_SUS_KSTAT
	bool "Enable to spoof suspicious kstat"
	depends on KSU_SUSFS
	default y

config KSU_SUSFS_SUS_OVERLAYFS
	bool "Enable to automatically spoof kstat and kstatfs for overlayed files/directories"
	depends on KSU_SUSFS
	default n

config KSU_SUSFS_TRY_UMOUNT
	bool "Enable to use ksu's try_umount"
	depends on KSU_SUSFS
	default y

config KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
	bool "Enable to add bind mounts to ksu's try_umount automatically"
	depends on KSU_SUSFS_TRY_UMOUNT
	default y

config KSU_SUSFS_SPOOF_UNAME
	bool "Enable to spoof uname"
	depends on KSU_SUSFS
	default y

config KSU_SUSFS_ENABLE_LOG
	bool "Enable logging susfs log to kernel"
	depends on KSU_SUSFS
	default n

config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
	bool "Enable to automatically hide ksu and susfs symbols from /proc/kallsyms"
	depends on KSU_SUSFS
	default y

config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
	bool "Enable to spoof /proc/bootconfig or /proc/cmdline"
	depends on KSU_SUSFS
	default y

config KSU_SUSFS_OPEN_REDIRECT
	bool "Enable to redirect a path to be opened with another path"
	depends on KSU_SUSFS
	default y

config KSU_SUSFS_SUS_SU
	bool "Enable SUS-SU in runtime temporarily"
	depends on KSU_SUSFS && KPROBES && HAVE_KPROBES && KPROBE_EVENTS
	default n

config KSU_SUSFS_SUS_MAP
	bool "Enable to hide some mmapped real file from different proc maps interfaces"
	depends on KSU_SUSFS
	default y
EOF
              fi

              if ! grep -q "CONFIG_KSU_SUSFS" fs/Makefile 2>/dev/null; then
                echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
              fi
            fi
          fi

          # Patch SELinux Static Symbol Export cho ReSukiSU / BakaSU / SukiSU
          echo "=== Patching SELinux Static Symbols ==="
          if [ -f security/selinux/selinuxfs.c ]; then
            sed -i 's/static const struct file_operations sel_handle_status_ops/const struct file_operations sel_handle_status_ops/g' security/selinux/selinuxfs.c
            sed -i 's/static DEFINE_MUTEX(sel_mutex);/DEFINE_MUTEX(sel_mutex);/g' security/selinux/selinuxfs.c
            sed -i 's/static ssize_t (\* const write_op\[\])/ssize_t (* const write_op[])/g' security/selinux/selinuxfs.c
          fi
          if [ -f security/selinux/ss/status.c ]; then
            sed -i 's/static struct page \*selinux_status_page;/struct page *selinux_status_page;/g' security/selinux/ss/status.c
            sed -i 's/static DEFINE_MUTEX(selinux_status_lock);/DEFINE_MUTEX(selinux_status_lock);/g' security/selinux/ss/status.c
          fi
          if [ -f security/selinux/ss/services.c ]; then
            sed -i 's/static DEFINE_RWLOCK(policy_rwlock);/DEFINE_RWLOCK(policy_rwlock);/g' security/selinux/ss/services.c
            sed -i 's/static void security_dump_masked_av(/void security_dump_masked_av(/g' security/selinux/ss/services.c
            sed -i 's/static void context_struct_compute_av(/void context_struct_compute_av(/g' security/selinux/ss/services.c
          fi


      - name: Extract KSU Metadata & Manager Compatibility
        id: ksu_meta
        working-directory: ${{ steps.kernel.outputs.kernel-folder }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KSU_VER=""
          KSU_TAG=""
          KSU_SIZE=""
          KSU_HASH=""

          if [ "${{ steps.workspace.outputs.kernelsu }}" = "Yes" ]; then
            KSU_DIR=""
            for d in KernelSU KernelSU-Next drivers/kernelsu; do
              if [ -d "$d" ]; then
                KSU_DIR="$d"
                break
              fi
            done

            if [ -n "$KSU_DIR" ]; then
              if [ -d "$KSU_DIR/.git" ]; then
                KSU_VER=$(git -C "$KSU_DIR" rev-list --count HEAD 2>/dev/null || echo "")
                KSU_TAG=$(git -C "$KSU_DIR" describe --tags --always 2>/dev/null || echo "")
              fi

              SIGN_FILES=$(find "$KSU_DIR" -type f \( -name "apk_sign.c" -o -name "apk_sign.h" -o -name "manager.c" -o -name "manager.h" \))
              if [ -n "$SIGN_FILES" ]; then
                KSU_SIZE=$(grep -E 'EXPECTED_SIZE|EXPECTED_SIGN_SIZE' $SIGN_FILES 2>/dev/null \
                  | awk -F'=' '{print $2}' | tr -d ';\r\n ' | sed 's/0x/ 0x/g' | xargs || echo "")
                KSU_HASH=$(grep -oE '[0-9a-fA-F]{64}' $SIGN_FILES 2>/dev/null | sort -u | tr '\n' ' ' || echo "")
              fi
            fi

            [ -z "$KSU_VER" ] && KSU_VER="Unknown"
            [ -z "$KSU_TAG" ] && KSU_TAG="${{ inputs.WHICH_KSU }}"
            [ -z "$KSU_SIZE" ] && KSU_SIZE="Built-in / Multiple"
            [ -z "$KSU_HASH" ] && KSU_HASH="Built-in Signatures (Official / Multi-manager)"
          else
            KSU_VER="Disabled"
            KSU_TAG="None"
            KSU_SIZE="None"
            KSU_HASH="None"
          fi

          echo "ksu_ver=${KSU_VER}" >> "$GITHUB_OUTPUT"
          echo "ksu_tag=${KSU_TAG}" >> "$GITHUB_OUTPUT"
          echo "ksu_size=${KSU_SIZE}" >> "$GITHUB_OUTPUT"
          echo "ksu_hash=${KSU_HASH}" >> "$GITHUB_OUTPUT"
          echo "elapsed_time=$(echo "$(date +%s) - ${{ steps.workspace.outputs.start_time }}" | bc)" >> "$GITHUB_OUTPUT"

          # Xác định thông tin & link tải Manager tương thích chuẩn
          KSU_CHOICE="${{ inputs.WHICH_KSU }}"
          GH_REPO_SLUG=""
          FALLBACK_REPO_SLUG=""
          PINNED_TAG=""

          if [ "${{ steps.workspace.outputs.kernelsu }}" = "Yes" ]; then
            case "$KSU_CHOICE" in
              "ReSukiSU")
                APP_NAME="ReSukiSU Manager"
                APP_REPO="https://github.com/ReSukiSU/ReSukiSU/releases"
                APP_NOTE="Ghim tại v4.2.0-rc3 để tương thích hoàn toàn với SuSFS. Khuyến nghị cài APK Manager v4.2.0-rc3 tương ứng."
                GH_REPO_SLUG="ReSukiSU/ReSukiSU"
                PINNED_TAG="v4.2.0-rc3"
                ;;
              "BakaSU")
                APP_NAME="BakaSU / ReSukiSU Manager"
                APP_REPO="https://github.com/Baka-SU/BakaSU/releases"
                APP_NOTE="Sử dụng BakaSU Manager (bản v4.2.0-rc3 nếu bật SuSFS để đồng bộ driver)."
                GH_REPO_SLUG="Baka-SU/BakaSU"
                FALLBACK_REPO_SLUG="ReSukiSU/ReSukiSU"
                [ "${{ inputs.enable_susfs }}" = "true" ] && PINNED_TAG="v4.2.0-rc3"
                ;;
              "SukiSU-Ultra")
                APP_NAME="SukiSU Manager"
                APP_REPO="https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases"
                APP_NOTE="Bắt buộc cài Manager của SukiSU để khớp driver hook và signature."
                GH_REPO_SLUG="SukiSU-Ultra/SukiSU-Ultra"
                ;;
              "XXKSU-SUSFS")
                APP_NAME="KernelSU Manager (SuSFS) / KSU-Next"
                APP_REPO="https://github.com/zenwav/KernelSU-SUSFS/releases"
                APP_NOTE="Dùng Manager từ kho phát hành zenwav hoặc Next Manager hỗ trợ SuSFS."
                GH_REPO_SLUG="zenwav/KernelSU-SUSFS"
                FALLBACK_REPO_SLUG="rifsxd/KernelSU-Next"
                ;;
              "RKSU (rsuntk)")
                APP_NAME="RKSU Manager"
                APP_REPO="https://github.com/rsuntk/KernelSU/releases"
                APP_NOTE="Tương thích phiên bản legacy v3.2.2-10."
                GH_REPO_SLUG="rsuntk/KernelSU"
                PINNED_TAG="v3.2.2-10-legacy"
                ;;
              "backslashxx-KernelSU")
                APP_NAME="Official KernelSU Manager (tiann)"
                APP_REPO="https://github.com/backslashxx/KernelSU/releases"
                APP_NOTE="Fork backslashxx giữ nguyên official testkey. Sử dụng trực tiếp APK chính thức từ https://github.com/backslashxx/KernelSU/releases (khuyến nghị bản mới nhất)."
                GH_REPO_SLUG="backslashxx/KernelSU"
                FALLBACK_REPO_SLUG="tiann/KernelSU"
                ;;
              "KOWX712-KernelSU")
                APP_NAME="KernelSU-Next / KOW Manager"
                APP_REPO="https://github.com/KOWX712/KernelSU/releases"
                APP_NOTE="Hỗ trợ multi-manager hoặc APK build của KOWX."
                GH_REPO_SLUG="KOWX712/KernelSU"
                FALLBACK_REPO_SLUG="rifsxd/KernelSU-Next"
                ;;
              "MidoriSU")
                APP_NAME="MidoriSU Manager"
                APP_REPO="https://github.com/midori01/KernelSU/releases"
                APP_NOTE="Sử dụng Manager tương thích từ kho phát hành của MidoriSU."
                GH_REPO_SLUG="midori01/KernelSU"
                ;;
              *)
                APP_NAME="KernelSU-Next Manager"
                APP_REPO="https://github.com/rifsxd/KernelSU-Next/releases"
                APP_NOTE="Dùng KernelSU-Next Manager (nhánh Legacy/v1.x)."
                GH_REPO_SLUG="rifsxd/KernelSU-Next"
                FALLBACK_REPO_SLUG="KernelSU-Next/KernelSU-Next"
                ;;
            esac

            # Hàm tìm và tải APK từ GitHub Releases
            fetch_apk_url() {
              local repo="$1"
              local tag="$2"
              local url=""
              local auth_header=()
              [ -n "$GH_TOKEN" ] && auth_header=(-H "Authorization: Bearer $GH_TOKEN")

              if [ -n "$tag" ]; then
                url=$(curl -sL "${auth_header[@]}" "https://api.github.com/repos/${repo}/releases/tags/${tag}" \
                  | jq -r '.assets[]? | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
              fi
              if [ -z "$url" ] || [ "$url" = "null" ]; then
                url=$(curl -sL "${auth_header[@]}" "https://api.github.com/repos/${repo}/releases" \
                  | jq -r '.[].assets[]? | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
              fi
              echo "$url"
            }

            APK_URL=$(fetch_apk_url "$GH_REPO_SLUG" "$PINNED_TAG")
            if [ -z "$APK_URL" ] && [ -n "$FALLBACK_REPO_SLUG" ]; then
              APK_URL=$(fetch_apk_url "$FALLBACK_REPO_SLUG" "$PINNED_TAG")
            fi

            if [ -n "$APK_URL" ] && [ "$APK_URL" != "null" ]; then
              ORIG_APK_NAME=$(basename "$APK_URL")
              SAFE_KSU=$(echo "$KSU_CHOICE" | tr -d ' ()' | tr '/' '-')
              # Đặt tên file APK có nhãn biến thể KSU ở đầu (nếu tên gốc chưa có)
              if [[ "${ORIG_APK_NAME,,}" == *"${SAFE_KSU,,}"* ]]; then
                FINAL_APK_NAME="$ORIG_APK_NAME"
              else
                FINAL_APK_NAME="${SAFE_KSU}_${ORIG_APK_NAME#KernelSU_}"
              fi
              echo "Đang tải Manager APK: $APK_URL -> $GITHUB_WORKSPACE/$FINAL_APK_NAME"
              curl -LSs "$APK_URL" -o "$GITHUB_WORKSPACE/$FINAL_APK_NAME" || true
              if [ -s "$GITHUB_WORKSPACE/$FINAL_APK_NAME" ]; then
                echo "APK_PATH=${FINAL_APK_NAME}" >> "$GITHUB_ENV"
              fi
            else
              echo "Không tìm thấy file APK trực tiếp từ API cho ${KSU_CHOICE}."
            fi
          else
            APP_NAME="Không sử dụng (No Root)"
            APP_REPO="N/A"
            APP_NOTE="Kernel build nguyên bản không tích hợp KSU."
          fi

          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_repo=${APP_REPO}" >> "$GITHUB_OUTPUT"
          echo "app_note=${APP_NOTE}" >> "$GITHUB_OUTPUT"

      - name: Build Kernel
        working-directory: ${{ steps.kernel.outputs.kernel-folder }}
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          sed -i 's/depends on DEBUG_KERNEL && KALLSYMS/depends on KALLSYMS/g' init/Kconfig

          make O=out vendor/munch_defconfig

          if [ "${{ inputs.ENABLE_KERNELSU }}" = "true" ]; then
            echo "=== Kích hoạt KernelSU Core ==="
            scripts/config --file out/.config --enable CONFIG_KSU
            scripts/config --file out/.config --enable CONFIG_KPROBES
            scripts/config --file out/.config --enable CONFIG_HAVE_KPROBES
            scripts/config --file out/.config --enable CONFIG_KPROBE_EVENTS
            scripts/config --file out/.config --enable CONFIG_KALLSYMS
            scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL
            scripts/config --file out/.config --enable CONFIG_SECURITY_SELINUX
            scripts/config --file out/.config --disable CONFIG_SCHED_DEBUG
          fi

          if [ "${{ inputs.ENABLE_KERNELSU }}" = "true" ] && [ "${{ inputs.enable_susfs }}" = "true" ]; then
            echo "=== Kích hoạt cấu hình SuSFS tối ưu vượt Bank/VCB ==="
            for cfg in \
              CONFIG_KSU_SUSFS \
              CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
              CONFIG_KSU_SUSFS_SUS_PATH \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_PATH \
              CONFIG_KSU_SUSFS_SUS_MOUNT \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_MOUNT \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
              CONFIG_KSU_SUSFS_TRY_UMOUNT \
              CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
              CONFIG_KSU_SUSFS_SUS_KSTAT \
              CONFIG_KSU_SUSFS_SUS_MAP \
              CONFIG_KSU_SUSFS_SPOOF_UNAME \
              CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              CONFIG_KSU_SUSFS_SPOOF_PROC_CMDLINE \
              CONFIG_KSU_SUSFS_OPEN_REDIRECT \
              CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS; do
              scripts/config --file out/.config --enable "$cfg"
            done

            # TẮT các cờ dễ gây xung đột hoặc lộ dấu vết khi VCB quét sâu
            scripts/config --file out/.config --disable CONFIG_KSU_SUSFS_SUS_OVERLAYFS
            scripts/config --file out/.config --disable CONFIG_KSU_SUSFS_ENABLE_LOG
            scripts/config --file out/.config --disable CONFIG_KSU_SUSFS_SUS_SU
          fi

          # Ẩn hậu tố tên kernel custom (-dirty / tên branch lạ) để tránh VCB bắt uname
          scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-perf"
          scripts/config --file out/.config --disable CONFIG_LOCALVERSION_AUTO

          make O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            olddefconfig

          echo "=== Kiểm tra các cờ CONFIG_KSU_SUSFS sau khi olddefconfig ==="
          grep "CONFIG_KSU" out/.config || true

          make -j$(nproc) \
            O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-


      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/kvsnr113/AnyKernel3.git AnyKernel3

      - name: Package Kernel
        run: |
          TARGET=MUNCH
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/${TARGET}-Image
          cp kernel/out/arch/arm64/boot/dtb AnyKernel3/${TARGET}-dtb
          cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/${TARGET}-dtbo.img

          sed -i "s/devicename=.*/devicename=munch/" AnyKernel3/anykernel.sh

          KSU_LABEL="${{ inputs.ENABLE_KERNELSU && inputs.WHICH_KSU || 'NoKSU' }}"
          SAFE_LABEL=$(echo "$KSU_LABEL" | tr -d ' ()' | tr '/' '-')

          # Thêm nhãn SuSFS vào tên file ZIP nếu đã bật
          if [ "${{ inputs.ENABLE_KERNELSU }}" = "true" ] && [ "${{ inputs.enable_susfs }}" = "true" ]; then
            ZIP_NAME="RE404-munch-Redmi-K40S_POCO-F4_strong568-${SAFE_LABEL}-SuSFS-$(date +%y%m%d-%H%M).zip"
          else
            ZIP_NAME="RE404-munch-Redmi-K40S_POCO-F4_strong568-${SAFE_LABEL}-$(date +%y%m%d-%H%M).zip"
          fi

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" META-INF tools MUNCH-* anykernel.sh
          cd ..

          echo "ZIP_PATH=${ZIP_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=build-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ inputs.WHICH_KSU }}
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.APK_PATH }}

      - name: Release Kernel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Kernel Munch [${{ inputs.ENABLE_KERNELSU && inputs.WHICH_KSU || 'NoKSU' }}]"
          body: |
            ### 📌 Thông tin Kernel & Quá trình Build
            - **Thiết bị:** POCO F4 (Munch / SM8250)
            - **Nhánh:** `${{ github.event.inputs.kernel_branch }}`
            - **KSU Variant:** `${{ inputs.ENABLE_KERNELSU && inputs.WHICH_KSU || 'Disabled' }}`
            - **SuSFS Support:** `${{ inputs.enable_susfs && 'Full Config Enabled' || 'Disabled' }}`
            - **KSU Version Count:** `${{ steps.ksu_meta.outputs.ksu_ver }}`
            - **KSU Tag / Git Ref:** `${{ steps.ksu_meta.outputs.ksu_tag }}`
            - **Thời gian build:** `${{ steps.ksu_meta.outputs.elapsed_time }}s`

            ---
            ### 🔑 Chữ ký Driver (Apk Signatures)
            - **Expected Sign Size:** `${{ steps.ksu_meta.outputs.ksu_size }}`
            - **Expected Sign Hash:** `${{ steps.ksu_meta.outputs.ksu_hash }}`

            ---
            ### 📱 Khuyến nghị Manager App tương thích
            - **Tên Manager:** **${{ steps.ksu_meta.outputs.app_name }}**
            - **Nơi tải:** [Tải APK tại đây](${{ steps.ksu_meta.outputs.app_repo }})
            - **Ghi chú tương thích:** ${{ steps.ksu_meta.outputs.app_note }}
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
