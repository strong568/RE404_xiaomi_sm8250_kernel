name: Build e404 Kernel with Multi-KSU & Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Branch to build"
        required: true
        default: "staging-bpf"
      ENABLE_KERNELSU:
        description: "Tích hợp KernelSU?"
        required: true
        type: boolean
        default: true
      WHICH_KSU:
        description: "Chọn biến thể KernelSU"
        required: true
        type: choice
        options:
          - "KernelSU-Next"
          - "SukiSU-Ultra"
          - "XXKSU-SUSFS"
          - "RKSU (rsuntk)"
          - "backslashxx-KernelSU"
          - "KOWX712-KernelSU"
        default: "backslashxx-KernelSU"
      enable_susfs:
        description: "Cấu hình CONFIG_KSU_SUSFS (Bật đầy đủ cờ ẩn Root)"
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Workspace Init
        id: workspace
        run: |
          echo "start_time=$(date +\%s)" >> "$GITHUB_OUTPUT"
          echo "kernelsu=${{ inputs.ENABLE_KERNELSU && 'Yes' || 'No' }}" >> "$GITHUB_OUTPUT"

      - name: Clone Kernel Source
        id: kernel
        run: |
          git clone \
            --recursive \
            --depth=1 \
            -b "${{ github.event.inputs.kernel_branch }}" \
            https://github.com/dumpcode404/xiaomi_sm8250_kernel_e404_fork.git kernel
          echo "kernel-folder=kernel" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libssl-dev \
            lld \
            llvm \
            python3 \
            zstd \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Download Neutron Clang
        run: |
          mkdir -p clang
          wget -qO clang.tar.zst https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst
          tar --zstd -xf clang.tar.zst -C clang
          
          CLANG_BIN="$(find "$GITHUB_WORKSPACE/clang" -type f -name 'clang' -exec dirname {} \; | head -n 1)"
          echo "Found Clang binary at: $CLANG_BIN"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

      - name: Adding KernelSU
        if: inputs.ENABLE_KERNELSU
        working-directory: ${{ steps.kernel.outputs.kernel-folder }}
        run: |
          KSU_CHOICE="${{ inputs.WHICH_KSU }}"
          echo "Setting up KernelSU fork: ${KSU_CHOICE}"

          case "$KSU_CHOICE" in
            "SukiSU-Ultra")
              [ -d KernelSU ] && curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/refs/heads/main/kernel/setup.sh" | bash -s -- --cleanup || true
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/refs/heads/main/kernel/setup.sh" | bash -s main
              ;;
            "XXKSU-SUSFS")
              [ -d KernelSU ] && curl -LSs "https://raw.githubusercontent.com/zenwav/KernelSU-SUSFS/refs/heads/master/kernel/setup.sh" | bash -s -- --cleanup || true
              curl -LSs "https://raw.githubusercontent.com/zenwav/KernelSU-SUSFS/refs/heads/master/kernel/setup.sh" | bash -s master
              ;;
            "RKSU (rsuntk)")
              [ -d KernelSU ] && curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s -- --cleanup || true
              curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s v3.2.2-10-legacy
              ;;
            "backslashxx-KernelSU")
              [ -d KernelSU ] && curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s -- --cleanup || true
              curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
              ;;
            "KOWX712-KernelSU")
              [ -d KernelSU ] && curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s -- --cleanup || true
              curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
              ;;
            *)
              [ -d KernelSU ] && curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/refs/heads/legacy/kernel/setup.sh" | bash -s -- --cleanup || true
              curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/refs/heads/legacy/kernel/setup.sh" | bash -s -- legacy
              ;;
          esac

      - name: Extract KSU Metadata & Manager Compatibility
        id: ksu_meta
        working-directory: ${{ steps.kernel.outputs.kernel-folder }}
        run: |
          KSU_VER=""
          KSU_TAG=""
          KSU_SIZE=""
          KSU_HASH=""

          if [ "${{ steps.workspace.outputs.kernelsu }}" = "Yes" ]; then
            KSU_DIR=""
            for d in KernelSU KernelSU-Next drivers/kernelsu; do
              if [ -d "$d" ]; then
                KSU_DIR="$d"
                break
              fi
            done

            if [ -n "$KSU_DIR" ]; then
              if [ -d "$KSU_DIR/.git" ]; then
                KSU_VER=$(git -C "$KSU_DIR" rev-list --count HEAD 2>/dev/null || echo "")
                KSU_TAG=$(git -C "$KSU_DIR" describe --tags --always 2>/dev/null || echo "")
              fi

              SIGN_FILES=$(find "$KSU_DIR" -type f \( -name "apk_sign.c" -o -name "apk_sign.h" -o -name "manager.c" -o -name "manager.h" \))
              if [ -n "$SIGN_FILES" ]; then
                KSU_SIZE=$(grep -E 'EXPECTED_SIZE|EXPECTED_SIGN_SIZE'$SIGN_FILES 2>/dev/null \
                  | awk -F'=' '{print $2}' | tr -d ';\r\n ' | sed 's/0x/ 0x/g' | xargs || echo "")
                KSU_HASH=$(grep -oE '[0-9a-fA-F]{64}'$SIGN_FILES 2>/dev/null | sort -u | tr '\n' ' ' || echo "")
              fi
            fi

            [ -z "$KSU_VER" ] && KSU_VER="Unknown"
            [ -z "$KSU_TAG" ] && KSU_TAG="${{ inputs.WHICH_KSU }}"
            [ -z "$KSU_SIZE" ] && KSU_SIZE="Built-in / Multiple"
            [ -z "$KSU_HASH" ] && KSU_HASH="Built-in Signatures (Official / Multi-manager)"
          else
            KSU_VER="Disabled"
            KSU_TAG="None"
            KSU_SIZE="None"
            KSU_HASH="None"
          fi

          echo "ksu_ver=${KSU_VER}" >> "$GITHUB_OUTPUT"
          echo "ksu_tag=${KSU_TAG}" >> "$GITHUB_OUTPUT"
          echo "ksu_size=${KSU_SIZE}" >> "$GITHUB_OUTPUT"
          echo "ksu_hash=${KSU_HASH}" >> "$GITHUB_OUTPUT"
          echo "elapsed_time=$(echo "$(date +%s) - ${{ steps.workspace.outputs.start_time }}" | bc)" >> "$GITHUB_OUTPUT"

          # Xác định thông tin & link tải Manager tương thích chuẩn
          KSU_CHOICE="${{ inputs.WHICH_KSU }}"
          if [ "${{ steps.workspace.outputs.kernelsu }}" = "Yes" ]; then
            case "$KSU_CHOICE" in
              "SukiSU-Ultra")
                APP_NAME="SukiSU Manager"
                APP_REPO="https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases"
                APP_NOTE="Bắt buộc cài Manager của SukiSU để khớp driver hook và signature."
                ;;
              "XXKSU-SUSFS")
                APP_NAME="KernelSU Manager (SuSFS) / KSU-Next"
                APP_REPO="https://github.com/zenwav/KernelSU-SUSFS/releases"
                APP_NOTE="Dùng Manager từ kho phát hành zenwav hoặc Next Manager hỗ trợ SuSFS."
                ;;
              "RKSU (rsuntk)")
                APP_NAME="RKSU Manager"
                APP_REPO="https://github.com/rsuntk/KernelSU/releases"
                APP_NOTE="Tương thích phiên bản legacy v3.2.2-10."
                ;;
              "backslashxx-KernelSU")
                APP_NAME="Official KernelSU Manager (tiann)"
                APP_REPO="https://github.com/tiann/KernelSU/releases"
                APP_NOTE="Fork backslashxx giữ nguyên official testkey. Sử dụng trực tiếp APK chính thức từ https://github.com/tiann/KernelSU/releases (khuyến nghị v0.9.5 hoặc bản mới nhất)."
                ;;
              "KOWX712-KernelSU")
                APP_NAME="KernelSU-Next / KOW Manager"
                APP_REPO="https://github.com/KOWX712/KernelSU/releases"
                APP_NOTE="Hỗ trợ multi-manager hoặc APK build của KOWX."
                ;;
              *)
                APP_NAME="KernelSU-Next Manager"
                APP_REPO="https://github.com/rifsxd/KernelSU-Next/releases"
                APP_NOTE="Dùng KernelSU-Next Manager (nhánh Legacy/v1.x)."
                ;;
            esac
          else
            APP_NAME="Không sử dụng (No Root)"
            APP_REPO="N/A"
            APP_NOTE="Kernel build nguyên bản không tích hợp KSU."
          fi

          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_repo=${APP_REPO}" >> "$GITHUB_OUTPUT"
          echo "app_note=${APP_NOTE}" >> "$GITHUB_OUTPUT"

      - name: Build Kernel
        working-directory: ${{ steps.kernel.outputs.kernel-folder }}
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out vendor/munch_defconfig

          if [ "${{ inputs.ENABLE_KERNELSU }}" = "true" ] && [ "${{ inputs.enable_susfs }}" = "true" ]; then
            echo "=== Kích hoạt toàn bộ các cờ bảo vệ SuSFS ==="
            for cfg in \
              CONFIG_KSU_SUSFS \
              CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_PATH \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_MOUNT \
              CONFIG_KSU_SUSFS_SUS_KSTAT \
              CONFIG_KSU_SUSFS_SUS_MOUNT \
              CONFIG_KSU_SUSFS_SPOOF_UNAME; do
              scripts/config --file out/.config --enable "$cfg" || echo "${cfg}=y" >> out/.config
            done
          fi

          make -j$(nproc) \
            O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/kvsnr113/AnyKernel3.git AnyKernel3

      - name: Package Kernel
        run: |
          TARGET=MUNCH
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/${TARGET}-Image
          cp kernel/out/arch/arm64/boot/dtb AnyKernel3/${TARGET}-dtb
          cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/${TARGET}-dtbo.img

          sed -i "s/devicename=.*/devicename=munch/" AnyKernel3/anykernel.sh

          KSU_LABEL="${{ inputs.ENABLE_KERNELSU && inputs.WHICH_KSU || 'NoKSU' }}"
          SAFE_LABEL=$(echo "$KSU_LABEL" | tr -d ' ()' | tr '/' '-')

          # Thêm nhãn SuSFS vào tên file ZIP nếu đã bật
          if [ "${{ inputs.ENABLE_KERNELSU }}" = "true" ] && [ "${{ inputs.enable_susfs }}" = "true" ]; then
            ZIP_NAME="RE404-POCO_F4-${SAFE_LABEL}-SuSFS-$(date +%y%m%d-%H%M).zip"
          else
            ZIP_NAME="RE404-POCO_F4-${SAFE_LABEL}-$(date +%y%m%d-%H%M).zip"
          fi

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" META-INF tools MUNCH-* anykernel.sh
          cd ..

          echo "ZIP_PATH=${ZIP_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=build-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ inputs.WHICH_KSU }}
          path: ${{ env.ZIP_PATH }}

      - name: Release Kernel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Kernel Munch [${{ inputs.ENABLE_KERNELSU && inputs.WHICH_KSU || 'NoKSU' }}]"
          body: |
            ### 📌 Thông tin Kernel & Quá trình Build
            - **Thiết bị:** POCO F4 (Munch / SM8250)
            - **Nhánh:** `${{ github.event.inputs.kernel_branch }}`
            - **KSU Variant:** `${{ inputs.ENABLE_KERNELSU && inputs.WHICH_KSU || 'Disabled' }}`
            - **SuSFS Support:** `${{ inputs.enable_susfs && 'Full Config Enabled' || 'Disabled' }}`
            - **KSU Version Count:** `${{ steps.ksu_meta.outputs.ksu_ver }}`
            - **KSU Tag / Git Ref:** `${{ steps.ksu_meta.outputs.ksu_tag }}`
            - **Thời gian build:** `${{ steps.ksu_meta.outputs.elapsed_time }}s`

            ---
            ### 🔑 Chữ ký Driver (Apk Signatures)
            - **Expected Sign Size:** `${{ steps.ksu_meta.outputs.ksu_size }}`
            - **Expected Sign Hash:** `${{ steps.ksu_meta.outputs.ksu_hash }}`

            ---
            ### 📱 Khuyến nghị Manager App tương thích
            - **Tên Manager:** **${{ steps.ksu_meta.outputs.app_name }}**
            - **Nơi tải:** [Tải APK tại đây](${{ steps.ksu_meta.outputs.app_repo }})
            - **Ghi chú tương thích:** ${{ steps.ksu_meta.outputs.app_note }}
          files: |
            ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
